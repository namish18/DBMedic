# pytest configuration
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: marks pure deterministic unit tests requiring no active database
    integration: marks live PostgreSQL integration tests requiring dbmedic_lab
    mutating: marks tests that modify the database state (apply index / DDL)
    model: marks tests requiring real Tiny Aya Global model inference (needs HF_TOKEN + hardware)
addopts = -v --tb=short
